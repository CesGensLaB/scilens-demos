processor: Compare

readers:

  csv:

    metrics:
      - col: "Y-Value-1"
        aggregation: "mean"
      - col: "Y-Value-1"
        aggregation: "sum"
      - col: "Y-Value-1"
        aggregation: "min"
      - name: "Metric Y"
        col: "Y-Value-1"
        aggregation: "max"
      - name: "Distance"
        aggregation: "mean"
        function: "euclidean_norm"
        components: ["time_x", "time_y", "time_z"]

      - col: "value"
        aggregation: "sum"

    cols:
      curve_parser:
        name: "col_x"
        parameters:
          x: ["time"]

report:

  output:
    export_json: true
    export_html: true


  html:
    curves:
      display_on_load: true
    parameter_page_mode:
      default_value: tabs