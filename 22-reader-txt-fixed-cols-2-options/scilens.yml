processor: Compare
file_reader:
  extension_readers_catalog:
    dat2: dat2
readers:
  catalog:
    dat2:
      type: txt_fixed_cols
      parameters:
        has_header: true
        has_header_line: 2
        has_header_ignore: ['##']
        cols:
          rows:
            ignore_patterns: ['##']

          curve_parser:
            name: "col_x"
            parameters:
              x: 1
report:
  output:
    export_html: true
    export_json: true

