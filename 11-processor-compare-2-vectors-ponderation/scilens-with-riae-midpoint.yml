processor: Compare
tags: [csv]
compare:
  float_thresholds:
    vectors:
      ponderation_method: RIAE_midpoint
      riae_threshold: 0.01
    vectors_columns:
      "Time (s)": null
      Amplitude:
        ponderation_method: RIAE_trapezoid
        riae_threshold: 0.01


readers:
  csv:
    cols:
      curve_parser:
        name: "col_x"
        parameters:
          x: 1
report:
  output:
    export_html: true
    export_json: true
  html:
    curves:
      display_on_load: true
    # parameter_page_mode:
    #   default_value: tabs
