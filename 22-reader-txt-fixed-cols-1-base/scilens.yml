processor: Compare
file_reader:
  extension_readers_catalog:
    dat1: dat1
    dat2: dat2
readers:
  catalog:
    dat1:
      type: txt_fixed_cols
      parameters:
        column_widths: [9, 13]
        cols:
          rows:
            ignore_patterns: ['##']
          curve_parser:
            name: "col_x"
            parameters:
              x: 1
    dat2:
      type: txt_fixed_cols
      parameters:
        has_header: true
        has_header_ignore: ['##']
        column_widths: [9, 13]
        cols:
          curve_parser:
            name: "col_x"
            parameters:
              x: 1
report:
  output:
    export_html: true
    export_json: true

