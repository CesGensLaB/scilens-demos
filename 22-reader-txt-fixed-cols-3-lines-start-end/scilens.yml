processor: Compare

file_reader:

  extension_readers_catalog:
    dat2: dat2

readers:

  catalog:
    
    dat2:  
      type: txt_fixed_cols
      parameters:
        cols:
          rows:
            ignore_patterns: ['##']      
            line_start: 3
            line_end: 8
          curve_parser:
            name: "col_x"
            parameters:
              x: 1

        has_header: true
        has_header_line: 2
        has_header_ignore: ['##']


report:

  output:
    export_html: true

  html:
    curves:
      display_on_load: true
